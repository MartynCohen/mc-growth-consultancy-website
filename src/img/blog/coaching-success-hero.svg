<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#000000"/>
      <rect x="0" y="0" width="1" height="40" fill="#1a1a1a"/>
      <rect x="0" y="0" width="40" height="1" fill="#1a1a1a"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Main content container -->
  <rect x="50" y="50" width="1100" height="530" fill="#ffffff" rx="25"/>
  
  <!-- Title section -->
  <text x="600" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#000000">
    COACHING FOR SUCCESS
  </text>
  
  <text x="600" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="normal" fill="#444444">
    Unlocking People Potential in the Flooring Industry
  </text>
  
  <!-- Success Steps/Stairs Visual -->
  <g transform="translate(200, 250)">
    <!-- Step 1 - Foundation -->
    <rect x="0" y="120" width="120" height="40" fill="#000000" rx="5"/>
    <text x="60" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">ASSESS</text>
    
    <!-- Step 2 - Growth -->
    <rect x="140" y="80" width="120" height="40" fill="#2a2a2a" rx="5"/>
    <text x="200" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">DEVELOP</text>
    
    <!-- Step 3 - Excellence -->
    <rect x="280" y="40" width="120" height="40" fill="#404040" rx="5"/>
    <text x="340" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">COACH</text>
    
    <!-- Step 4 - Success -->
    <rect x="420" y="0" width="120" height="40" fill="#000000" rx="5"/>
    <text x="480" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SUCCEED</text>
    
    <!-- Connecting arrows between steps -->
    <path d="M120 140 L140 100" stroke="#666666" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M260 100 L280 60" stroke="#666666" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M400 60 L420 20" stroke="#666666" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Figure climbing the steps -->
    <g transform="translate(350, 45)">
      <!-- Person silhouette -->
      <circle cx="15" cy="10" r="8" fill="#000000"/>
      <rect x="10" y="18" width="10" height="25" fill="#000000" rx="3"/>
      <rect x="5" y="20" width="8" height="3" fill="#000000" rx="1"/>
      <rect x="17" y="20" width="8" height="3" fill="#000000" rx="1"/>
      <rect x="12" y="43" width="3" height="15" fill="#000000" rx="1"/>
      <rect x="16" y="43" width="3" height="15" fill="#000000" rx="1"/>
    </g>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
    </marker>
  </defs>
  
  <!-- Right side - GROW Model Visual -->
  <g transform="translate(650, 280)">
    <rect x="0" y="0" width="300" height="120" fill="#f8f8f8" rx="10" stroke="#e0e0e0" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#000000">
      GROW MODEL
    </text>
    
    <!-- GROW components -->
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">G</text>
    <text x="35" y="50" font-family="Arial, sans-serif" font-size="12" fill="#333333">oals</text>
    
    <text x="90" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">R</text>
    <text x="105" y="50" font-family="Arial, sans-serif" font-size="12" fill="#333333">eality</text>
    
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">O</text>
    <text x="35" y="75" font-family="Arial, sans-serif" font-size="12" fill="#333333">ptions</text>
    
    <text x="90" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">W</text>
    <text x="105" y="75" font-family="Arial, sans-serif" font-size="12" fill="#333333">ill/Way Forward</text>
    
    <!-- Coaching cycle arrows -->
    <circle cx="220" cy="60" r="35" fill="none" stroke="#000000" stroke-width="3"/>
    <path d="M220 25 L230 35 L210 35 Z" fill="#000000"/>
    <text x="220" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">COACHING</text>
    <text x="220" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">CYCLE</text>
  </g>
  
  <!-- MC Growth Consultancy Logo -->
  <g transform="translate(950, 450)">
    <!-- Logo circle -->
    <circle cx="70" cy="50" r="60" fill="#000000"/>
    <text x="45" y="65" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff">MC</text>
    
    <!-- Company text -->
    <text x="70" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">
      MARTYN COHEN
    </text>
    <text x="70" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#666666">
      GROWTH CONSULTANCY
    </text>
  </g>
  
  <!-- Bottom inspirational text -->
  <text x="600" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#333333">
    Transform Your Team • Build Capability • Drive Performance
  </text>
  
  <!-- Subtle success elements -->
  <g transform="translate(100, 400)">
    <!-- Trophy icon -->
    <path d="M20 30 L30 25 L40 30 L35 40 L25 40 Z" fill="#000000"/>
    <rect x="27" y="40" width="6" height="8" fill="#000000"/>
    <rect x="22" y="48" width="16" height="4" fill="#000000" rx="2"/>
  </g>
  
  <g transform="translate(150, 420)">
    <!-- Star icon -->
    <path d="M10 0 L12 8 L20 8 L14 12 L16 20 L10 15 L4 20 L6 12 L0 8 L8 8 Z" fill="#000000"/>
  </g>
</svg>