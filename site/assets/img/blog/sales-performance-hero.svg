<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f1f1f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="800" height="400" fill="url(#hero-bg)"/>
  
  <!-- Sales performance graphics -->
  <g transform="translate(50, 80)">
    <!-- Performance chart -->
    <rect x="20" y="40" width="280" height="180" fill="#2a2a2a" stroke="#444444" stroke-width="2" rx="5"/>
    
    <!-- Chart bars -->
    <rect x="40" y="160" width="25" height="40" fill="#666666"/>
    <rect x="75" y="140" width="25" height="60" fill="#666666"/>
    <rect x="110" y="120" width="25" height="80" fill="#666666"/>
    <rect x="145" y="100" width="25" height="100" fill="#888888"/>
    <rect x="180" y="80" width="25" height="120" fill="#aaaaaa"/>
    <rect x="215" y="60" width="25" height="140" fill="#cccccc"/>
    <rect x="250" y="50" width="25" height="150" fill="#ffffff"/>
    
    <!-- Chart title -->
    <text x="160" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Sales Performance Growth</text>
    
    <!-- Upward arrow -->
    <path d="M 260 80 L 280 60 L 275 65 L 285 65 L 280 60 L 285 55 L 275 55 L 280 60" fill="#ffffff"/>
    
    <!-- Team figures -->
    <g transform="translate(50, 250)">
      <!-- Person 1 -->
      <circle cx="30" cy="20" r="8" fill="#888888"/>
      <rect x="25" y="28" width="10" height="15" fill="#888888" rx="1"/>
      
      <!-- Person 2 -->
      <circle cx="60" cy="20" r="8" fill="#888888"/>
      <rect x="55" y="28" width="10" height="15" fill="#888888" rx="1"/>
      
      <!-- Person 3 -->
      <circle cx="90" cy="20" r="8" fill="#888888"/>
      <rect x="85" y="28" width="10" height="15" fill="#888888" rx="1"/>
      
      <!-- Connection lines -->
      <line x1="40" y1="35" x2="50" y2="35" stroke="#666666" stroke-width="1"/>
      <line x1="70" y1="35" x2="80" y2="35" stroke="#666666" stroke-width="1"/>
    </g>
  </g>
  
  <!-- MC Growth Consultancy Logo -->
  <g transform="translate(480, 80)">
    <!-- Logo background circle -->
    <circle cx="80" cy="80" r="60" fill="#ffffff"/>
    
    <!-- MC text -->
    <text x="80" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#000000">MC</text>
    
    <!-- Underline -->
    <rect x="45" y="85" width="70" height="2" fill="#000000"/>
    
    <!-- Martyn Cohen text -->
    <text x="80" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#000000">MARTYN COHEN</text>
    
    <!-- Growth Consultancy text -->
    <text x="80" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="400" fill="#000000" letter-spacing="1px">GROWTH CONSULTANCY</text>
  </g>
  
  <!-- Title overlay -->
  <g transform="translate(50, 300)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Driving Sales Performance</text>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#cccccc">A Practical Guide to Managing Your Sales Team</text>
    
    <!-- Decorative line -->
    <rect x="0" y="45" width="400" height="2" fill="#ffffff" opacity="0.3"/>
  </g>
  
  <!-- Performance icons -->
  <g transform="translate(600, 280)" fill="#ffffff" opacity="0.6">
    <!-- Target icon -->
    <circle cx="15" cy="15" r="12" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="15" cy="15" r="6" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="15" cy="15" r="2" fill="#ffffff"/>
    
    <!-- Chart icon -->
    <g transform="translate(40, 5)">
      <rect x="0" y="15" width="4" height="10" fill="#ffffff"/>
      <rect x="6" y="10" width="4" height="15" fill="#ffffff"/>
      <rect x="12" y="5" width="4" height="20" fill="#ffffff"/>
      <rect x="18" y="0" width="4" height="25" fill="#ffffff"/>
    </g>
  </g>
</svg>