<svg width="600" height="500" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leadership-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="500" fill="url(#leadership-bg)"/>
  
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Situational Leadership (SLII Model)</text>
  <text x="300" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#cccccc">Adapt Your Leadership Style to Each Situation</text>
  
  <!-- Four Quadrants -->
  <g transform="translate(50, 100)">
    
    <!-- S1 - Directing -->
    <rect x="0" y="0" width="240" height="160" fill="#333333" stroke="#555555" stroke-width="2" rx="5"/>
    <text x="120" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">S1: Directing</text>
    <text x="120" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cccccc">High Direction • Low Support</text>
    
    <!-- Icon for directing -->
    <circle cx="50" cy="80" r="15" fill="#ffffff"/>
    <text x="50" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">→</text>
    
    <text x="80" y="85" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Clear instructions</text>
    <text x="20" y="105" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">• Tell exactly what to do</text>
    <text x="20" y="120" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">• Monitor progress closely</text>
    <text x="20" y="135" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">• New to task</text>
    <text x="20" y="150" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">• Needs clear boundaries</text>
    
    <!-- S2 - Coaching -->
    <rect x="260" y="0" width="240" height="160" fill="#333333" stroke="#555555" stroke-width="2" rx="5"/>
    <text x="380" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">S2: Coaching</text>
    <text x="380" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cccccc">High Direction • High Support</text>
    
    <!-- Icon for coaching -->
    <circle cx="310" cy="80" r="15" fill="#ffffff"/>
    <text x="310" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">?</text>
    
    <text x="340" y="85" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Guidance + Support</text>
    <text x="280" y="105" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">• Provide detailed guidance</text>
    <text x="280" y="120" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">• Increase encouragement</text>
    <text x="280" y="135" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">• Some competence</text>
    <text x="280" y="150" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">• Lacks confidence</text>
    
    <!-- S3 - Supporting -->
    <rect x="0" y="180" width="240" height="160" fill="#333333" stroke="#555555" stroke-width="2" rx="5"/>
    <text x="120" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">S3: Supporting</text>
    <text x="120" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cccccc">Low Direction • High Support</text>
    
    <!-- Icon for supporting -->
    <circle cx="50" cy="260" r="15" fill="#ffffff"/>
    <text x="50" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">🤝</text>
    
    <text x="80" y="265" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Facilitate &amp; Encourage</text>
    <text x="20" y="285" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">• Step back on instructions</text>
    <text x="20" y="300" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">• Focus on facilitating</text>
    <text x="20" y="315" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">• Experienced but needs reassurance</text>
    <text x="20" y="330" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">• Encourage problem-solving</text>
    
    <!-- S4 - Delegating -->
    <rect x="260" y="180" width="240" height="160" fill="#333333" stroke="#555555" stroke-width="2" rx="5"/>
    <text x="380" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">S4: Delegating</text>
    <text x="380" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cccccc">Low Direction • Low Support</text>
    
    <!-- Icon for delegating -->
    <circle cx="310" cy="260" r="15" fill="#ffffff"/>
    <text x="310" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">✓</text>
    
    <text x="340" y="265" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Trust &amp; Empower</text>
    <text x="280" y="285" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">• Trust with outcome</text>
    <text x="280" y="300" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">• Involve in decisions</text>
    <text x="280" y="315" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">• Highly competent</text>
    <text x="280" y="330" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">• Self-manage</text>
  </g>
  
  <!-- Key Principle -->
  <rect x="50" y="370" width="500" height="80" fill="#222222" stroke="#444444" stroke-width="1" rx="5"/>
  <text x="300" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Key Principle: Flexibility</text>
  <text x="300" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cccccc">Adapt your leadership style based on each colleague's</text>
  <text x="300" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cccccc">skill level and motivation for the specific task</text>
  
  <!-- Direction/Support Axes Labels -->
  <text x="30" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888888" transform="rotate(-90 30 200)">HIGH SUPPORT</text>
  <text x="30" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888888" transform="rotate(-90 30 280)">LOW SUPPORT</text>
  
  <text x="150" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888888">HIGH DIRECTION</text>
  <text x="410" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888888">LOW DIRECTION</text>
</svg>