<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <radialGradient id="bgGradient" cx="40%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  
  <!-- Subtle geometric pattern -->
  <g opacity="0.04">
    <path d="M0,200 Q200,100 400,200 T800,150" stroke="#ffffff" stroke-width="2" fill="none"/>
    <path d="M200,400 Q400,300 600,400 T1000,350" stroke="#ffffff" stroke-width="1" fill="none"/>
    <circle cx="900" cy="150" r="60" stroke="#ffffff" stroke-width="1" fill="none"/>
  </g>

  <!-- People networking icons in background -->
  <g transform="translate(50, 100)" opacity="0.06">
    <!-- Person 1 -->
    <circle cx="30" cy="30" r="20" fill="#ffffff"/>
    <ellipse cx="30" cy="70" rx="25" ry="35" fill="#ffffff"/>
    
    <!-- Connection lines -->
    <path d="M60,50 L140,80 M60,50 L140,40 M60,50 L140,120" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Person 2 -->
    <circle cx="160" cy="50" r="18" fill="#ffffff"/>
    <ellipse cx="160" cy="85" rx="22" ry="30" fill="#ffffff"/>
    
    <!-- Person 3 -->
    <circle cx="160" cy="140" r="16" fill="#ffffff"/>
    <ellipse cx="160" cy="170" rx="20" ry="25" fill="#ffffff"/>
  </g>

  <!-- Success/talent icons -->
  <g transform="translate(1000, 450)" opacity="0.08">
    <!-- Trophy/success icon -->
    <ellipse cx="40" cy="60" rx="25" ry="15" fill="#ffffff"/>
    <rect x="25" y="35" width="30" height="30" fill="#ffffff" rx="3"/>
    <rect x="35" y="20" width="10" height="20" fill="#ffffff"/>
    <circle cx="40" cy="15" r="8" fill="#ffffff"/>
  </g>

  <!-- Main heading -->
  <text x="600" y="170" text-anchor="middle" 
        fill="url(#titleGradient)" 
        font-family="Arial, sans-serif" 
        font-size="44" 
        font-weight="900"
        filter="url(#dropShadow)">
    UNLOCKING RECRUITMENT
  </text>
  
  <!-- Second line with accent color -->
  <text x="600" y="220" text-anchor="middle" 
        fill="url(#accentGradient)" 
        font-family="Arial, sans-serif" 
        font-size="48" 
        font-weight="900"
        filter="url(#dropShadow)">
    SUCCESS
  </text>

  <!-- Subtitle -->
  <text x="600" y="260" text-anchor="middle" 
        fill="#ffffff" 
        font-family="Arial, sans-serif" 
        font-size="22" 
        font-weight="500"
        opacity="0.9">
    People-Focused Strategies for Finding Top Talent
  </text>

  <!-- Eye-catching accent bar -->
  <rect x="350" y="280" width="500" height="3" fill="url(#accentGradient)" rx="2"/>

  <!-- Key strategies - Left side -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="280" height="32" rx="16" fill="url(#accentGradient)" opacity="0.9"/>
    <text x="140" y="22" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">
      ✓ Proven Sourcing Methods
    </text>
  </g>
  
  <g transform="translate(100, 365)">
    <rect x="0" y="0" width="280" height="32" rx="16" fill="url(#secondaryGradient)" opacity="0.9"/>
    <text x="140" y="22" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">
      ✓ Empathetic Human Interaction
    </text>
  </g>
  
  <g transform="translate(100, 410)">
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#f59e0b" opacity="0.9"/>
    <text x="140" y="22" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">
      ✓ Attract Best Candidates
    </text>
  </g>

  <!-- Right side - Benefits -->
  <g transform="translate(650, 330)">
    <circle cx="0" cy="10" r="5" fill="#8b5cf6"/>
    <text x="15" y="15" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="500">
      Expert Talent Acquisition Strategies
    </text>
  </g>
  
  <g transform="translate(650, 360)">
    <circle cx="0" cy="10" r="5" fill="#06b6d4"/>
    <text x="15" y="15" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="500">
      People-Centered Recruitment Approach
    </text>
  </g>
  
  <g transform="translate(650, 390)">
    <circle cx="0" cy="10" r="5" fill="#f59e0b"/>
    <text x="15" y="15" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="500">
      Build High-Performance Teams
    </text>
  </g>
  
  <g transform="translate(650, 420)">
    <circle cx="0" cy="10" r="5" fill="#22c55e"/>
    <text x="15" y="15" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="500">
      Sustainable Recruitment Success
    </text>
  </g>

  <!-- Company Logo Integration -->
  <g transform="translate(50, 480)">
    <!-- MC Logo Circle Background -->
    <circle cx="50" cy="50" r="42" fill="#ffffff"/>
    
    <!-- MC Text -->
    <text x="50" y="60" text-anchor="middle" 
          fill="#000000" 
          font-family="Arial, sans-serif" 
          font-size="28" 
          font-weight="900">
      MC
    </text>
    
    <!-- Company name -->
    <text x="50" y="75" text-anchor="middle" 
          fill="#000000" 
          font-family="Arial, sans-serif" 
          font-size="6" 
          font-weight="600">
      MARTYN COHEN
    </text>
    
    <text x="50" y="83" text-anchor="middle" 
          fill="#000000" 
          font-family="Arial, sans-serif" 
          font-size="5" 
          font-weight="400">
      GROWTH CONSULTANCY
    </text>
  </g>

  <!-- Strategic insight badge -->
  <g transform="translate(950, 50)">
    <rect x="0" y="0" width="200" height="40" rx="20" fill="url(#accentGradient)" opacity="0.9"/>
    <text x="100" y="26" text-anchor="middle" 
          fill="#ffffff" 
          font-family="Arial, sans-serif" 
          font-size="16" 
          font-weight="700">
      STRATEGIC INSIGHTS
    </text>
  </g>

  <!-- Social media optimized border -->
  <rect x="2" y="2" width="1196" height="626" 
        stroke="#333333" 
        stroke-width="2" 
        fill="none" 
        rx="10"/>
</svg>