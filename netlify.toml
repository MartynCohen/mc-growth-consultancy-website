# Netlify settings for the MC Growth Consultancy website.
# The site is built by build.py from src/ into site/. Netlify runs the build and publishes site/.
[build]
  command = "python3 build.py"
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
